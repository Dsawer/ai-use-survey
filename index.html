<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Use in Civil Engineering Studies</title>
  <meta name="description" content="METU study on AI use in civil engineering studies" />
  <meta name="theme-color" content="#1d4060" />
  <link rel="icon" type="image/svg+xml" href="assets/metu-logo.svg?v=25" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<body>
  <!-- Top bar: brand + progress -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#welcome">
        <img class="brand-logo" src="assets/metu-logo.svg?v=25" alt="METU" width="471" height="398" />

        <span class="progress-text" id="progressText">0 / 0</span>

  <!-- Step indicator (the 5 task groups); shown on group pages -->
  <nav class="stepper" id="stepper" aria-label="Sections" hidden></nav>

  <!-- Dynamic view: welcome | group page | done -->
  <main class="view" id="view" tabindex="-1"></main>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="assets/js/config.js?v=40"></script>
  <script src="assets/js/data.js?v=40"></script>
  <script src="assets/js/app.js?v=40"></script>

</html>
